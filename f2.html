<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple E-Commerce Store</title>
  <style>
    /* ----- 1. CSS Styling ----- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      color: #333;
      padding-bottom: 40px;
    }

    header {
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      text-align: center;
      margin-bottom: 25px;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 25px;
    }

    /* ----- Filter & Product Grid ----- */
    .filter-section {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-section span {
      font-weight: 600;
      color: #555;
    }

    .filter-btn {
      background-color: #e0e0e0;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background-color: #3498db;
      color: #fff;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
    }

    .product-title {
      font-size: 1.1rem;
      margin: 10px 0 5px 0;
      color: #2c3e50;
    }

    .product-category {
      font-size: 0.85rem;
      color: #7f8c8d;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .product-price {
      font-weight: bold;
      font-size: 1.1rem;
      color: #27ae60;
      margin-bottom: 15px;
    }

    .add-btn {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .add-btn:hover {
      background-color: #219150;
    }

    /* ----- Cart Section ----- */
    .cart-section {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      height: fit-content;
    }

    .cart-section h2 {
      margin-bottom: 15px;
      border-bottom: 2px solid #f4f7f6;
      padding-bottom: 10px;
      color: #2c3e50;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    .cart-item-details strong {
      display: block;
      color: #333;
    }

    .cart-item-details small {
      color: #666;
    }

    .remove-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.3s ease;
    }

    .remove-btn:hover {
      background-color: #c0392b;
    }

    .total-price {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 20px;
      text-align: right;
      color: #2c3e50;
    }

    .empty-cart-msg {
      color: #888;
      font-style: italic;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Simple E-Commerce Store</h1>
  </header>

  <div class="container">
    <!-- Main Product List Area -->
    <main>
      <div class="filter-section">
        <span>Filter by:</span>
        <button class="filter-btn active" onclick="filterProducts('all', event)">All</button>
        <button class="filter-btn" onclick="filterProducts('Clothing', event)">Clothing</button>
        <button class="filter-btn" onclick="filterProducts('Electronics', event)">Electronics</button>
      </div>

      <div class="products-grid" id="products-container">
        <!-- Products rendered dynamically via JavaScript -->
      </div>
    </main>

    <!-- Cart Sidebar -->
    <aside class="cart-section">
      <h2>Shopping Cart</h2>
      <div id="cart-items">
        <p class="empty-cart-msg">Your cart is currently empty.</p>
      </div>
      <div class="total-price">
        Total: $<span id="cart-total">0.00</span>
      </div>
    </aside>
  </div>

  <!-- ----- JavaScript Logic ----- -->
  <script>
    // 1. Products Dataset
    const products = [
      { id: 1, name: "Cotton T-Shirt", category: "Clothing", price: 25.00 },
      { id: 2, name: "Denim Jeans", category: "Clothing", price: 45.00 },
      { id: 3, name: "Wireless Earbuds", category: "Electronics", price: 60.00 },
      { id: 4, name: "Smartwatch", category: "Electronics", price: 120.00 },
      { id: 5, name: "Running Shoes", category: "Clothing", price: 55.00 },
      { id: 6, name: "Power Bank 10000mAh", category: "Electronics", price: 30.00 }
    ];

    // Array to hold cart items
    let cart = [];

    // 2. Render Products
    function renderProducts(itemsToRender) {
      const container = document.getElementById('products-container');
      container.innerHTML = '';

      itemsToRender.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div>
            <h3 class="product-title">${product.name}</h3>
            <p class="product-category">${product.category}</p>
          </div>
          <div>
            <p class="product-price">$${product.price.toFixed(2)}</p>
            <button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 3. Filter Products
    function filterProducts(category, event) {
      // Update active button state
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Filter logic
      if (category === 'all') {
        renderProducts(products);
      } else {
        const filtered = products.filter(p => p.category === category);
        renderProducts(filtered);
      }
    }

    // 4. Add Product to Cart
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const cartItem = cart.find(item => item.id === productId);

      if (cartItem) {
        cartItem.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCartUI();
    }

    // 5. Remove Product from Cart
    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartUI();
    }

    // 6. Update Cart Display and Total Calculation
    function updateCartUI() {
      const cartContainer = document.getElementById('cart-items');
      const totalContainer = document.getElementById('cart-total');

      if (cart.length === 0) {
        cartContainer.innerHTML = '<p class="empty-cart-msg">Your cart is currently empty.</p>';
        totalContainer.innerText = '0.00';
        return;
      }

      cartContainer.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        const itemElement = document.createElement('div');
        itemElement.className = 'cart-item';
        itemElement.innerHTML = `
          <div class="cart-item-details">
            <strong>${item.name}</strong>
            <small>$${item.price.toFixed(2)} × ${item.quantity}</small>
          </div>
          <button class="remove-btn" onclick="removeFromCart(${item.id})">Remove</button>
        `;
        cartContainer.appendChild(itemElement);
      });

      totalContainer.innerText = total.toFixed(2);
    }

    // Initial render
    renderProducts(products);
  </script>
</body>
</html>
